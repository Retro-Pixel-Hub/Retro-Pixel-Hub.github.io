<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game Over · Retro Pixel Hub</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f1410">
  <link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
  <style>
    @font-face { font-family: 'Press Start 2P'; src: url('/assets/fonts/press-start-2p.woff2') format('woff2'); font-display: swap; }
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: #0b100d; color: #c8d8c0; font: 16px/1.6 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { font: 28px/1.3 'Press Start 2P', monospace; color: #9bbc0f; margin: 0 0 .6em; text-shadow: 3px 3px 0 #000; }
    p { margin: 0 0 1.6em; }
    a { display: inline-block; font: 12px/1 'Press Start 2P', monospace; color: #0b100d; background: #f8d048; padding: 14px 18px; text-decoration: none; border: 3px solid #000; box-shadow: 4px 4px 0 #000; }
    a:hover, a:focus-visible { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000; outline: none; }
  </style>
</head>
<body>
  <main>
    <h1>GAME OVER</h1>
    <p>404: this level doesn't exist.</p>
    <a href="/">BACK TO THE HUB</a>
  </main>
</body>
</html>
